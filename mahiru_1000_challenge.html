<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Mahiru 1000 · frymedia_official</title>
  <style>
    :root {
      /* Adaptive / warm defaults (overridden by image) */
      --accent: #e4b37a;
      --accent-soft: #f2d9b0;
      --accent-deep: #c99255;
      --surface: rgba(255, 251, 246, 0.82);
      --surface-solid: #fffbf6;
      --background: #faf4ec;
      --background-2: #f3e8d9;
      --text: #4a3728;
      --text-soft: #8a6e55;
      --text-muted: #b89a7c;
      --border: rgba(220, 185, 145, 0.38);
      --success: #5a9a52;
      --error: #c46b5a;
      --radius: 20px;
      --radius-sm: 12px;
      --shadow: 0 10px 36px rgba(160, 120, 80, 0.10);
      --shadow-soft: 0 4px 14px rgba(160, 120, 80, 0.07);
    }

    /* Full dark elegant system theme */
    [data-theme="dark"] {
      --accent: #c9a86c;
      --accent-soft: #d4b87a;
      --accent-deep: #a88850;
      --surface: rgba(28, 28, 30, 0.92);
      --surface-solid: #1c1c1e;
      --background: #0c0c0e;
      --background-2: #121214;
      --text: #f2efe8;
      --text-soft: #a8a098;
      --text-muted: #6e6860;
      --border: rgba(255, 255, 255, 0.09);
      --success: #6bb86a;
      --error: #d47a6a;
      --shadow: 0 10px 36px rgba(0, 0, 0, 0.45);
      --shadow-soft: 0 4px 14px rgba(0, 0, 0, 0.3);
    }

    [data-theme="dark"] .ambient {
      background:
        radial-gradient(ellipse 70% 45% at 85% -5%, rgba(201, 168, 108, 0.08), transparent),
        radial-gradient(ellipse 50% 35% at 10% 95%, rgba(201, 168, 108, 0.05), transparent),
        linear-gradient(180deg, #0c0c0e 0%, #121214 100%);
    }

    [data-theme="dark"] .brand {
      background: #000;
      border-color: rgba(255,255,255,0.1);
    }

    [data-theme="dark"] .brand-name { color: #f0ece4; }
    [data-theme="dark"] .brand-tag { color: rgba(200, 195, 185, 0.5); }
    [data-theme="dark"] .icon-btn {
      border-color: rgba(255,255,255,0.12);
      color: rgba(240, 236, 228, 0.7);
      background: rgba(255,255,255,0.05);
    }

    [data-theme="dark"] .hero {
      background: linear-gradient(160deg, #1a1a1c, #141416);
      border-color: rgba(255,255,255,0.08);
    }

    [data-theme="dark"] .hero-btn {
      background: rgba(28, 28, 30, 0.95);
      color: var(--text);
      border-color: rgba(255,255,255,0.1);
    }

    [data-theme="dark"] .theme-chip.active {
      background: #f2efe8;
      color: #0c0c0e;
      border-color: #f2efe8;
    }

    [data-theme="dark"] .popup {
      background: #1c1c1e;
      border-color: rgba(255,255,255,0.1);
    }

    [data-theme="dark"] .input-field {
      background: #1c1c1e;
    }

    [data-theme="dark"] meta,
    [data-theme="dark"] {
      color-scheme: dark;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; overflow-x: hidden; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--background);
      color: var(--text);
      min-height: 100vh; min-height: 100dvh;
      display: flex; justify-content: center;
      line-height: 1.45;
      transition: background 0.55s ease, color 0.4s ease;
    }

    .ambient {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background:
        radial-gradient(ellipse 80% 50% at 80% -10%, color-mix(in srgb, var(--accent-soft) 50%, transparent), transparent),
        radial-gradient(ellipse 60% 40% at 10% 90%, color-mix(in srgb, var(--accent) 18%, transparent), transparent),
        linear-gradient(180deg, var(--background) 0%, var(--background-2) 100%);
      transition: background 0.7s ease;
    }

    .app {
      position: relative; z-index: 1;
      width: 100%; max-width: 430px;
      min-height: 100vh; min-height: 100dvh;
      padding: 12px 16px 22px;
      padding-top: max(12px, env(safe-area-inset-top));
      padding-bottom: max(22px, env(safe-area-inset-bottom));
      display: flex; flex-direction: column; gap: 11px;
    }

    /* ===== BRAND HEADER ===== */
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 10px 8px 8px;
      background: #0a0a0a;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 6px 24px rgba(0,0,0,0.25);
      transition: background 0.5s ease, border-color 0.5s ease;
    }

    .brand-logo {
      width: 46px; height: 46px;
      border-radius: 11px;
      object-fit: contain;
      background: #000;
      flex-shrink: 0;
    }

    .brand-text-wrap { flex: 1; min-width: 0; overflow: hidden; }

    .brand-name {
      font-size: 0.92rem;
      font-weight: 650;
      letter-spacing: 0.05em;
      color: #f0ece4;
      white-space: nowrap;
    }

    .brand-tag {
      font-size: 0.6rem;
      color: rgba(200, 195, 185, 0.55);
      margin-top: 2px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .icon-btn {
      width: 34px; height: 34px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.05);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: rgba(240, 236, 228, 0.75);
      flex-shrink: 0;
      transition: transform 0.12s;
    }
    .icon-btn:active { transform: scale(0.93); }
    .icon-btn svg { width: 16px; height: 16px; }

    /* Theme toggle */
    .theme-row {
      display: flex;
      gap: 6px;
      justify-content: center;
      margin-top: -2px;
    }
    .theme-chip {
      padding: 5px 12px;
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      border-radius: 100px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-soft);
      cursor: pointer;
      transition: background 0.2s, color 0.2s, border-color 0.2s, transform 0.12s;
    }
    .theme-chip:active { transform: scale(0.96); }
    .theme-chip.active {
      background: var(--text);
      color: var(--surface-solid);
      border-color: var(--text);
    }

    /* Title row */
    .title-row {
      text-align: center;
      padding: 2px 0 0;
    }
    .title {
      font-size: 1.22rem;
      font-weight: 750;
      letter-spacing: -0.03em;
      color: var(--text);
    }
    .subtitle {
      font-size: 0.7rem;
      color: var(--text-soft);
      margin-top: 2px;
      font-weight: 450;
    }

    /* HERO */
    .hero {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9.2;
      max-height: 190px;
      border-radius: var(--radius);
      overflow: hidden;
      background: linear-gradient(160deg, color-mix(in srgb, var(--accent-soft) 35%, white), color-mix(in srgb, var(--accent) 12%, var(--background-2)));
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }
    .hero img {
      width: 100%; height: 100%;
      object-fit: cover; object-position: center 25%;
      display: block;
    }
    .hero-placeholder {
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 6px;
      color: var(--text-muted); font-size: 0.78rem; font-weight: 500;
    }
    .hero-placeholder svg { width: 34px; height: 34px; opacity: 0.4; }
    .hero-btn {
      position: absolute; bottom: 8px; right: 8px;
      background: rgba(255, 251, 246, 0.92);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 0.66rem; font-weight: 600;
      color: var(--text); cursor: pointer;
      box-shadow: var(--shadow-soft);
      display: flex; align-items: center; gap: 4px;
    }
    .hero-btn:active { transform: scale(0.96); }

    /* PROGRESS */
    .progress-card {
      background: var(--surface);
      backdrop-filter: blur(18px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 14px 13px;
      box-shadow: var(--shadow);
    }
    .progress-top {
      display: flex; align-items: flex-end; justify-content: space-between;
      margin-bottom: 10px;
    }
    .progress-main { display: flex; align-items: baseline; gap: 3px; }
    .progress-num {
      font-size: 2.35rem; font-weight: 750;
      letter-spacing: -0.04em; line-height: 1;
      color: var(--text); font-variant-numeric: tabular-nums;
    }
    .progress-slash { font-size: 1.15rem; color: var(--text-muted); opacity: 0.8; }
    .progress-total { font-size: 1.2rem; font-weight: 550; color: var(--text-soft); }
    .progress-side { text-align: right; }
    .progress-pct {
      font-size: 1rem; font-weight: 700;
      color: var(--accent-deep); letter-spacing: -0.02em;
    }
    .progress-remain {
      font-size: 0.7rem; font-weight: 500;
      color: var(--text-soft); margin-top: 2px;
    }
    .bar-track {
      height: 9px;
      background: color-mix(in srgb, var(--accent) 14%, transparent);
      border-radius: 100px; overflow: hidden; margin-bottom: 8px;
    }
    .bar-fill {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, var(--accent-soft), var(--accent));
      border-radius: 100px;
      box-shadow: 0 0 10px color-mix(in srgb, var(--accent) 30%, transparent);
      transition: width 0.45s cubic-bezier(0.22, 1, 0.36, 1), background 0.5s ease;
    }
    .progress-status {
      font-size: 0.74rem; font-weight: 500;
      color: var(--text-soft); text-align: center;
    }

    /* INPUT */
    .input-section { display: flex; flex-direction: column; gap: 8px; }
    .input-field {
      width: 100%; padding: 14px 15px;
      font-size: 1.02rem; font-weight: 500;
      color: var(--text); background: var(--surface-solid);
      border: 1.5px solid var(--border); border-radius: 14px;
      outline: none; box-shadow: var(--shadow-soft);
      transition: border-color 0.2s, box-shadow 0.2s;
      -webkit-appearance: none; appearance: none;
    }
    .input-field::placeholder { color: var(--text-muted); font-weight: 400; }
    .input-field:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent);
    }
    .input-field.ok {
      border-color: var(--success);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--success) 20%, transparent);
    }
    .input-field.err {
      border-color: var(--error);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--error) 18%, transparent);
    }
    .input-field:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-primary {
      width: 100%; padding: 13px;
      font-size: 0.92rem; font-weight: 650;
      color: var(--text);
      background: linear-gradient(180deg, var(--accent-soft), var(--accent));
      border: none; border-radius: 14px; cursor: pointer;
      box-shadow: 0 4px 14px color-mix(in srgb, var(--accent) 26%, transparent);
      letter-spacing: 0.04em;
      transition: transform 0.12s, box-shadow 0.12s, background 0.5s, opacity 0.2s;
      -webkit-appearance: none; appearance: none;
    }
    .btn-primary:active:not(:disabled) {
      transform: scale(0.975);
      box-shadow: 0 2px 8px color-mix(in srgb, var(--accent) 20%, transparent);
    }
    .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }

    .feedback {
      text-align: center; font-size: 0.78rem; font-weight: 600;
      min-height: 1.2em; opacity: 0; transform: translateY(-3px);
      transition: opacity 0.25s, transform 0.25s; pointer-events: none;
    }
    .feedback.show { opacity: 1; transform: translateY(0); }
    .feedback.ok { color: var(--success); }
    .feedback.err { color: var(--error); }

    /* HISTORY */
    .history-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-soft);
      overflow: hidden;
      display: flex; flex-direction: column;
      max-height: 160px;
    }
    .history-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      font-size: 0.72rem; font-weight: 650;
      color: var(--text-soft);
      letter-spacing: 0.02em;
    }
    .history-count { font-weight: 500; color: var(--text-muted); }
    .history-list {
      overflow-y: auto; -webkit-overflow-scrolling: touch;
      padding: 4px 0;
      flex: 1;
    }
    .history-item {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 12px;
      font-size: 0.78rem;
      color: var(--text-soft);
      border-bottom: 1px solid color-mix(in srgb, var(--border) 40%, transparent);
    }
    .history-item:last-child { border-bottom: none; }
    .history-item .num {
      font-weight: 700; color: var(--text);
      font-variant-numeric: tabular-nums;
      min-width: 2.4em;
    }
    .history-item .txt { flex: 1; }
    .history-item .mark {
      color: var(--success); font-weight: 700; font-size: 0.85rem;
    }
    .history-empty {
      padding: 16px; text-align: center;
      font-size: 0.78rem; color: var(--text-muted);
    }

    /* ACTIONS */
    .actions { display: flex; gap: 8px; }
    .btn-ghost {
      flex: 1; padding: 10px 12px;
      font-size: 0.78rem; font-weight: 600;
      color: var(--text-soft);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px; cursor: pointer;
      box-shadow: var(--shadow-soft);
      transition: transform 0.12s, opacity 0.2s;
      -webkit-appearance: none; appearance: none;
    }
    .btn-ghost:active:not(:disabled) { transform: scale(0.97); }
    .btn-ghost:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn-ghost.danger {
      color: var(--error);
      border-color: color-mix(in srgb, var(--error) 28%, var(--border));
    }

    .footer {
      text-align: center; font-size: 0.62rem;
      color: var(--text-muted); opacity: 0.75;
      margin-top: auto; padding-top: 4px;
    }

    /* OVERLAY / POPUP */
    .overlay {
      position: fixed; inset: 0; z-index: 300;
      display: flex; align-items: center; justify-content: center;
      background: color-mix(in srgb, var(--background) 82%, rgba(20,15,10,0.35));
      backdrop-filter: blur(14px);
      opacity: 0; pointer-events: none;
      transition: opacity 0.35s;
      padding: 20px;
    }
    .overlay.show { opacity: 1; pointer-events: auto; }

    .popup {
      text-align: center;
      padding: 28px 24px 22px;
      background: var(--surface-solid);
      border-radius: 22px;
      box-shadow: 0 20px 50px rgba(100, 70, 40, 0.2);
      border: 1px solid var(--border);
      transform: scale(0.9);
      transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
      max-width: 320px; width: 100%;
    }
    .overlay.show .popup { transform: scale(1); }

    .popup-icon {
      width: 52px; height: 52px; margin: 0 auto 12px;
      border-radius: 16px;
      background: linear-gradient(145deg, var(--accent-soft), var(--accent));
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 6px 18px color-mix(in srgb, var(--accent) 30%, transparent);
    }
    .popup-icon svg { width: 26px; height: 26px; color: var(--text); }

    .popup-title {
      font-size: 1.28rem; font-weight: 750;
      color: var(--text); margin-bottom: 6px;
    }
    .popup-sub {
      font-size: 0.88rem; color: var(--text-soft);
      margin-bottom: 6px; line-height: 1.45;
    }
    .popup-remain {
      font-size: 0.8rem; font-weight: 600;
      color: var(--accent-deep); margin-bottom: 18px;
    }

    .popup-actions {
      display: flex; flex-direction: column; gap: 8px;
    }
    .popup-btn {
      padding: 12px 18px;
      font-size: 0.88rem; font-weight: 650;
      border: none; border-radius: 12px; cursor: pointer;
      transition: transform 0.12s;
    }
    .popup-btn:active { transform: scale(0.97); }
    .popup-btn.primary {
      color: var(--text);
      background: linear-gradient(180deg, var(--accent-soft), var(--accent));
      box-shadow: 0 4px 12px color-mix(in srgb, var(--accent) 25%, transparent);
    }
    .popup-btn.secondary {
      color: var(--text-soft);
      background: color-mix(in srgb, var(--surface) 90%, transparent);
      border: 1px solid var(--border);
    }

    .confetti {
      position: absolute; width: 7px; height: 7px;
      border-radius: 2px; pointer-events: none;
    }

    #fileInput { display: none; }

    @media (prefers-reduced-motion: reduce) {
      .brand-name { animation: none; }
      .bar-fill, .feedback, .overlay, .popup { transition: none !important; }
    }
  </style>
</head>

        </div>
      </div>
      <div class="bar-track"><div class="bar-fill" id="progressBar"></div></div>
      <div class="progress-status" id="statusText">Mulai mengetik</div>
    </div>

    <!-- Input -->
    <div class="input-section">
      <input type="text" id="typeInput" class="input-field" placeholder="Ketik: Mahiru Sayang"
        autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" />
      <button type="button" class="btn-primary" id="btnEnter">ENTER</button>
      <div class="feedback" id="feedback"></div>
    </div>

    <!-- History full -->
    <div class="history-card">
      <div class="history-head">
        <span>Riwayat Entry</span>
        <span class="history-count" id="historyCount">0 entry</span>
      </div>
      <div class="history-list" id="historyList">
        <div class="history-empty" id="historyEmpty">Belum ada entry</div>
      </div>
    </div>

    <!-- Actions -->
    <div class="actions">
      <button type="button" class="btn-ghost" id="btnUndo" disabled>Undo</button>
      <button type="button" class="btn-ghost danger" id="btnReset">Reset</button>
    </div>

    <p class="footer">Progress tersimpan di perangkat · frymedia_official</p>
  </div>

  <!-- Popup (milestone + final) -->
  <div class="overlay" id="popupOverlay" aria-hidden="true">
    <div class="popup">
      <div class="popup-icon" id="popupIcon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
        </svg>
      </div>
      <div class="popup-title" id="popupTitle">Milestone!</div>
      <div class="popup-sub" id="popupSub">Kerja bagus</div>
      <div class="popup-remain" id="popupRemain"></div>
      <div class="popup-actions" id="popupActions">
        <button type="button" class="popup-btn primary" id="popupOk">Lanjut</button>
      </div>
    </div>
  </div>

  <script>
(function () {
  'use strict';

  const TARGET = 1000;
  const EXACT_LOWER = 'mahiru sayang';
  const STORAGE_KEY = 'mahiru1000_v5';
  const MILESTONES = [100, 200, 300, 400, 500, 600, 700, 800, 900, 1000];

  const $ = (id) => document.getElementById(id);
  const countDisplay = $('countDisplay');
  const progressBar = $('progressBar');
  const pctDisplay = $('pctDisplay');
  const remainDisplay = $('remainDisplay');
  const statusText = $('statusText');
  const typeInput = $('typeInput');
  const btnEnter = $('btnEnter');
  const feedback = $('feedback');
  const historyList = $('historyList');
  const historyEmpty = $('historyEmpty');
  const historyCount = $('historyCount');
  const btnUndo = $('btnUndo');
  const btnReset = $('btnReset');
  const heroImg = $('heroImg');
  const heroPlaceholder = $('heroPlaceholder');
  const fileInput = $('fileInput');
  const btnChangeImg = $('btnChangeImg');
  const popupOverlay = $('popupOverlay');
  const popupTitle = $('popupTitle');
  const popupSub = $('popupSub');
  const popupRemain = $('popupRemain');
  const popupActions = $('popupActions');
  const popupOk = $('popupOk');
  const btnFullscreen = $('btnFullscreen');

  let count = 0;
  let history = []; // array of { n, text }
  let feedbackTimer = null;
  let shownMilestones = {};
  let appTheme = 'dark'; // 'dark' | 'adaptive'
  let savedAdaptiveColors = null;
  const themeSystemBtn = $('themeSystem');
  const themeAdaptiveBtn = $('themeAdaptive');

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) {
        applyAppTheme();
        return;
      }
      const data = JSON.parse(raw);
      if (typeof data.count === 'number' && data.count >= 0 && data.count <= TARGET) count = data.count;
      if (Array.isArray(data.history)) history = data.history;
      if (data.shownMilestones) shownMilestones = data.shownMilestones;
      if (data.appTheme === 'adaptive' || data.appTheme === 'dark') appTheme = data.appTheme;
      else if (data.brandTheme === 'adaptive') appTheme = 'adaptive';
      else if (data.brandTheme === 'system') appTheme = 'dark';
      if (data.colors) savedAdaptiveColors = data.colors;
      if (data.imageData) applyImage(data.imageData, false);
      applyAppTheme();
    } catch (e) {
      applyAppTheme();
    }
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        count,
        history,
        shownMilestones,
        appTheme,
        imageData: heroImg.src && heroImg.src.startsWith('data:') ? heroImg.src : null,
        colors: savedAdaptiveColors
      }));
    } catch (e) {}
  }

  function clearInlineColors() {
    const root = document.documentElement;
    ['--accent','--accent-soft','--accent-deep','--background','--background-2','--text','--text-soft'].forEach(function (k) {
      root.style.removeProperty(k);
    });
  }

  function applyAppTheme() {
    const root = document.documentElement;
    if (appTheme === 'dark') {
      root.setAttribute('data-theme', 'dark');
      clearInlineColors();
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', '#0c0c0e');
      if (themeSystemBtn) themeSystemBtn.classList.add('active');
      if (themeAdaptiveBtn) themeAdaptiveBtn.classList.remove('active');
    } else {
      root.removeAttribute('data-theme');
      if (savedAdaptiveColors) applyColors(savedAdaptiveColors);
      else clearInlineColors();
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', savedAdaptiveColors && savedAdaptiveColors.background ? savedAdaptiveColors.background : '#faf4ec');
      if (themeSystemBtn) themeSystemBtn.classList.remove('active');
      if (themeAdaptiveBtn) themeAdaptiveBtn.classList.add('active');
    }
  }

  function setAppTheme(mode) {
    appTheme = mode === 'adaptive' ? 'adaptive' : 'dark';
    applyAppTheme();
    save();
  }

  function getCurrentColors() {
    const s = getComputedStyle(document.documentElement);
    return {
      accent: s.getPropertyValue('--accent').trim(),
      accentSoft: s.getPropertyValue('--accent-soft').trim(),
      accentDeep: s.getPropertyValue('--accent-deep').trim(),
      background: s.getPropertyValue('--background').trim(),
      background2: s.getPropertyValue('--background-2').trim(),
      text: s.getPropertyValue('--text').trim(),
      textSoft: s.getPropertyValue('--text-soft').trim()
    };
  }

  function updateUI() {
    countDisplay.textContent = count;
    const pct = count === 0 ? 0 : Math.round((count / TARGET) * 1000) / 10;
    pctDisplay.textContent = pct + '%';
    progressBar.style.width = (count / TARGET * 100) + '%';
    const remain = TARGET - count;
    remainDisplay.textContent = remain === 0 ? 'Selesai' : 'Sisa ' + remain;

    if (count === 0) statusText.textContent = 'Mulai mengetik';
    else if (count < 100) statusText.textContent = 'Awal yang bagus, teruskan';
    else if (count < 300) statusText.textContent = 'Sudah mulai terbiasa';
    else if (count < 500) statusText.textContent = 'Hampir setengah jalan';
    else if (count < 700) statusText.textContent = 'Lewat setengah, semangat';
    else if (count < 900) statusText.textContent = 'Tinggal dikit lagi';
    else if (count < TARGET) statusText.textContent = 'Hampir selesai';
    else statusText.textContent = '1000 selesai';

    renderHistory();
    btnUndo.disabled = count === 0;
    const done = count >= TARGET;
    typeInput.disabled = done;
    btnEnter.disabled = done;
    typeInput.placeholder = done ? 'Challenge selesai' : 'Ketik: Mahiru Sayang';
  }

  function renderHistory() {
    historyCount.textContent = history.length + ' entry';
    if (history.length === 0) {
      historyList.innerHTML = '<div class="history-empty">Belum ada entry</div>';
      return;
    }
    // Newest first
    const items = history.slice().reverse();
    historyList.innerHTML = items.map(function (h) {
      return '<div class="history-item"><span class="num">#' + h.n + '</span><span class="txt">' +
        escapeHtml(h.text) + '</span><span class="mark">&#10003;</span></div>';
    }).join('');
    // Keep scroll at top (newest)
    historyList.scrollTop = 0;
  }

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function showFeedback(msg, type) {
    if (feedbackTimer) clearTimeout(feedbackTimer);
    feedback.textContent = msg;
    feedback.className = 'feedback show ' + (type || '');
    feedbackTimer = setTimeout(function () { feedback.classList.remove('show'); }, 1800);
  }

  function normalize(str) {
    return str.trim().replace(/\s+/g, ' ').toLowerCase();
  }

  function checkMilestone(n) {
    if (MILESTONES.indexOf(n) === -1) return;
    if (shownMilestones[n]) return;
    shownMilestones[n] = true;
    save();
    if (n === TARGET) {
      showFinalPopup();
    } else {
      showMilestonePopup(n);
    }
  }

  function showMilestonePopup(n) {
    const remain = TARGET - n;
    popupTitle.textContent = n + ' Entry Tercapai';
    popupSub.textContent = 'Kerja bagus! Kamu sudah mengetik “Mahiru Sayang” sebanyak ' + n + ' kali.';
    popupRemain.textContent = 'Sisa ' + remain + ' lagi menuju 1000';
    popupActions.innerHTML = '<button type="button" class="popup-btn primary" id="popupOk">Lanjut</button>';
    popupOverlay.classList.add('show');
    popupOverlay.setAttribute('aria-hidden', 'false');
    spawnConfetti(18);
    document.getElementById('popupOk').onclick = hidePopup;
  }

  function showFinalPopup() {
    popupTitle.textContent = '1000 Selesai';
    popupSub.textContent = 'Kamu berhasil menyelesaikan challenge Mahiru 1000. Luar biasa.';
    popupRemain.textContent = '';
    popupActions.innerHTML =
      '<button type="button" class="popup-btn primary" id="btnRestart">Ulang dari Awal</button>' +
      '<button type="button" class="popup-btn secondary" id="btnShare">Bagikan / Foto</button>' +
      '<button type="button" class="popup-btn secondary" id="popupOk">Tutup</button>';
    popupOverlay.classList.add('show');
    popupOverlay.setAttribute('aria-hidden', 'false');
    spawnConfetti(36);
    document.getElementById('popupOk').onclick = hidePopup;
    document.getElementById('btnRestart').onclick = function () {
      hidePopup();
      doReset(true);
    };
    document.getElementById('btnShare').onclick = shareResult;
  }

  function hidePopup() {
    popupOverlay.classList.remove('show');
    popupOverlay.setAttribute('aria-hidden', 'true');
  }

  function spawnConfetti(n) {
    const colors = [
      getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#e4b37a',
      '#f2d9b0', '#c99255', '#5eb0f0', '#e8c090'
    ];
    for (let i = 0; i < n; i++) {
      const el = document.createElement('div');
      el.className = 'confetti';
      el.style.background = colors[i % colors.length];
      el.style.left = (12 + Math.random() * 76) + '%';
      el.style.top = (20 + Math.random() * 40) + '%';
      popupOverlay.appendChild(el);
      const dx = (Math.random() - 0.5) * 220;
      const dy = 80 + Math.random() * 200;
      el.animate([
        { opacity: 1, transform: 'translate(0,0) rotate(0deg) scale(1)' },
        { opacity: 0, transform: 'translate(' + dx + 'px,' + dy + 'px) rotate(' + (Math.random() * 400) + 'deg) scale(0.3)' }
      ], {
        duration: 1000 + Math.random() * 900,
        easing: 'cubic-bezier(0.22, 1, 0.36, 1)',
        delay: Math.random() * 150
      }).onfinish = function () { el.remove(); };
    }
  }

  async function shareResult() {
    const text = 'Saya menyelesaikan Mahiru 1000 Challenge — 1000× “Mahiru Sayang” · frymedia_official';
    try {
      if (navigator.share) {
        await navigator.share({ title: 'Mahiru 1000 Challenge', text: text });
        return;
      }
    } catch (e) {}
    try {
      await navigator.clipboard.writeText(text);
      showFeedback('Teks disalin ke clipboard', 'ok');
    } catch (e) {
      showFeedback('Salin manual: ' + text, 'ok');
    }
    hidePopup();
  }

  function submitEntry() {
    if (count >= TARGET) return;
    const val = typeInput.value;
    if (normalize(val) === EXACT_LOWER) {
      count += 1;
      const text = val.trim().replace(/\s+/g, ' ') || 'Mahiru Sayang';
      history.push({ n: count, text: text });
      typeInput.value = '';
      typeInput.classList.remove('err');
      typeInput.classList.add('ok');
      setTimeout(function () { typeInput.classList.remove('ok'); }, 350);
      showFeedback('#' + count + ' tersimpan', 'ok');
      updateUI();
      save();
      checkMilestone(count);
      typeInput.focus();
    } else {
      typeInput.classList.remove('ok');
      typeInput.classList.add('err');
      setTimeout(function () { typeInput.classList.remove('err'); }, 420);
      showFeedback('Tulis: Mahiru Sayang', 'err');
      typeInput.focus();
    }
  }

  function undo() {
    if (count <= 0) return;
    count -= 1;
    history.pop();
    // Allow re-showing milestone if they undo past it
    MILESTONES.forEach(function (m) {
      if (count < m) delete shownMilestones[m];
    });
    updateUI();
    save();
    showFeedback('Undo → #' + count, 'ok');
    typeInput.focus();
  }

  function doReset(force) {
    if (!force && !confirm('Reset progress ke 0?\nSemua riwayat akan dihapus.')) return;
    count = 0;
    history = [];
    shownMilestones = {};
    typeInput.value = '';
    typeInput.disabled = false;
    btnEnter.disabled = false;
    updateUI();
    save();
    showFeedback('Progress direset', 'ok');
    typeInput.focus();
  }

  function applyImage(src, extract) {
    heroImg.src = src;
    heroImg.style.display = 'block';
    heroPlaceholder.style.display = 'none';
    if (extract) setTimeout(function () { extractColors(src); }, 40);
  }

  function extractColors(src) {
    const img = new Image();
    img.onload = function () {
      try {
        const canvas = document.createElement('canvas');
        const size = 72;
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        ctx.drawImage(img, 0, 0, size, size);
        const data = ctx.getImageData(0, 0, size, size).data;
        const samples = [];
        for (let i = 0; i < data.length; i += 4) {
          const r = data[i], g = data[i + 1], b = data[i + 2], a = data[i + 3];
          if (a < 200) continue;
          const lum = 0.299 * r + 0.587 * g + 0.114 * b;
          if (lum < 32 || lum > 248) continue;
          const max = Math.max(r, g, b), min = Math.min(r, g, b);
          const sat = max === 0 ? 0 : (max - min) / max;
          if (sat < 0.07) continue;
          samples.push({ r: r, g: g, b: b, sat: sat, warm: r / 255 });
        }
        let r, g, b;
        if (samples.length < 6) {
          let sr = 0, sg = 0, sb = 0, n = 0;
          for (let i = 0; i < data.length; i += 4) {
            const pr = data[i], pg = data[i + 1], pb = data[i + 2], a = data[i + 3];
            if (a < 128) continue;
            const lum = 0.299 * pr + 0.587 * pg + 0.114 * pb;
            if (lum < 40 || lum > 230) continue;
            sr += pr; sg += pg; sb += pb; n++;
          }
          if (n < 4) return;
          r = Math.round(sr / n); g = Math.round(sg / n); b = Math.round(sb / n);
        } else {
          samples.sort(function (a, b) {
            return (b.sat * 1.15 + b.warm * 0.25) - (a.sat * 1.15 + a.warm * 0.25);
          });
          const top = Math.max(5, Math.floor(samples.length * 0.22));
          let sr = 0, sg = 0, sb = 0;
          for (let i = 0; i < top; i++) {
            sr += samples[i].r; sg += samples[i].g; sb += samples[i].b;
          }
          r = Math.round(sr / top); g = Math.round(sg / top); b = Math.round(sb / top);
        }
        finalizeColors(r, g, b);
      } catch (e) {}
    };
    img.src = src;
  }

  function finalizeColors(r, g, b) {
    const accent = rgbHex(r, g, b);
    const soft = rgbHex(Math.min(255, r + (255 - r) * 0.45), Math.min(255, g + (255 - g) * 0.45), Math.min(255, b + (255 - b) * 0.45));
    const deep = rgbHex(r * 0.76, g * 0.76, b * 0.76);
    const bg = rgbHex(Math.min(255, r + (255 - r) * 0.90), Math.min(255, g + (255 - g) * 0.90), Math.min(255, b + (255 - b) * 0.90));
    const bg2 = rgbHex(Math.min(255, r + (255 - r) * 0.80), Math.min(255, g + (255 - g) * 0.80), Math.min(255, b + (255 - b) * 0.80));
    const text = rgbHex(r * 0.26, g * 0.23, b * 0.20);
    const textSoft = rgbHex(Math.min(175, r * 0.26 + 58), Math.min(155, g * 0.23 + 48), Math.min(135, b * 0.20 + 42));
    applyColors({ accent: accent, accentSoft: soft, accentDeep: deep, background: bg, background2: bg2, text: text, textSoft: textSoft });
    save();
  }

  function applyColors(c) {
    if (!c) return;
    savedAdaptiveColors = c;
    if (appTheme !== 'adaptive') return;
    const root = document.documentElement;
    if (c.accent) root.style.setProperty('--accent', c.accent);
    if (c.accentSoft) root.style.setProperty('--accent-soft', c.accentSoft);
    if (c.accentDeep) root.style.setProperty('--accent-deep', c.accentDeep);
    if (c.background) root.style.setProperty('--background', c.background);
    if (c.background2) root.style.setProperty('--background-2', c.background2);
    if (c.text) root.style.setProperty('--text', c.text);
    if (c.textSoft) root.style.setProperty('--text-soft', c.textSoft);
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta && c.background) meta.setAttribute('content', c.background);
  }

  function rgbHex(r, g, b) {
    return '#' + [r, g, b].map(function (x) {
      const h = Math.max(0, Math.min(255, Math.round(x))).toString(16);
      return h.length === 1 ? '0' + h : h;
    }).join('');
  }

  function blockPaste(e) {
    e.preventDefault();
    showFeedback('Ketik manual', 'err');
  }
  typeInput.addEventListener('paste', blockPaste);
  typeInput.addEventListener('drop', function (e) { e.preventDefault(); showFeedback('Ketik manual', 'err'); });
  typeInput.addEventListener('dragover', function (e) { e.preventDefault(); });
  typeInput.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && (e.key === 'v' || e.key === 'V')) {
      e.preventDefault();
      showFeedback('Ketik manual', 'err');
      return;
    }
    if (e.key === 'Enter') { e.preventDefault(); submitEntry(); }
  });

  function toggleFullscreen() {
    const doc = document;
    if (!doc.fullscreenElement && !doc.webkitFullscreenElement) {
      const el = doc.documentElement;
      if (el.requestFullscreen) el.requestFullscreen();
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    } else {
      if (doc.exitFullscreen) doc.exitFullscreen();
      else if (doc.webkitExitFullscreen) doc.webkitExitFullscreen();
    }
  }

  btnEnter.addEventListener('click', submitEntry);
  btnUndo.addEventListener('click', undo);
  btnReset.addEventListener('click', function () { doReset(false); });
  btnFullscreen.addEventListener('click', toggleFullscreen);
  btnChangeImg.addEventListener('click', function () { fileInput.click(); });
  if (themeSystemBtn) themeSystemBtn.addEventListener('click', function () { setAppTheme('dark'); });
  if (themeAdaptiveBtn) themeAdaptiveBtn.addEventListener('click', function () { setAppTheme('adaptive'); });
  fileInput.addEventListener('change', function () {
    const file = fileInput.files && fileInput.files[0];
    if (!file || !file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = function (ev) {
      applyImage(ev.target.result, true);
      save();
    };
    reader.readAsDataURL(file);
    fileInput.value = '';
  });

  load();
  updateUI();
  if (count < TARGET) setTimeout(function () { typeInput.focus(); }, 250);
})();
  </script>
</body>
